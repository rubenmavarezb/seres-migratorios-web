name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx astro check

      - run: npm run lint

      - run: npm run test:unit

      - run: npx prettier --check .

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm test

      # SM-059: the open-call form only exists when the convocatoria is open,
      # which no committed build ever is (`abierta: false`, CLAUDE.md's rule
      # against inventing/leaving open sensitive state). This runner-only
      # step flips it, rebuilds, and re-runs just the `@abierta`-tagged specs
      # against that throwaway build; nothing here is committed back.
      - name: Abrir la convocatoria 02 solo en este runner
        run: |
          sed -i 's/^abierta: false$/abierta: true/' src/content/convocatorias/edicion-02.md
          grep -q '^abierta: true$' src/content/convocatorias/edicion-02.md

      - run: npm run build

      - name: Playwright — convocatoria abierta (@abierta)
        run: npx playwright test --grep @abierta
        env:
          CONVOCATORIA_ABIERTA: '1'

      - name: Subir el reporte de Playwright si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
