<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Formularios</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;box-sizing:border-box}.fila{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}.nota{font-family:var(--fuente-mono);font-size:11px;color:var(--grafito);text-transform:uppercase;letter-spacing:.04em}</style></head><body class="papel"><div id="root"></div>
<script type="text/babel">
const { Boton, Campo } = window.SeresMigratoriosDesignSystem_0c7dc7;
function App(){
  const [v,setV]=React.useState({nombre:'',email:'mail-sin-arroba',disc:'',msg:'',ok:true});
  return <div style={{display:'flex',flexDirection:'column',gap:32}}>
    <div className="fila" style={{alignItems:'center',gap:16}}>
      <Boton>Postulate</Boton><Boton variante="sello">Aportar</Boton><Boton chico>Ver todos</Boton><Boton chico variante="sello">Seguinos</Boton><Boton disabled>Enviar</Boton>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2, minmax(0,1fr))',gap:'24px 40px',maxWidth:620}}>
      <Campo etiqueta="Nombre" nombre="nombre" valor={v.nombre} onChange={e=>setV({...v,nombre:e.target.value})} placeholder="Tu nombre" requerido />
      <Campo etiqueta="Email" tipo="email" nombre="email" valor={v.email} onChange={e=>setV({...v,email:e.target.value})} error="Revisá el email: falta la arroba." />
      <Campo etiqueta="Disciplina" tipo="select" nombre="disc" valor={v.disc} onChange={e=>setV({...v,disc:e.target.value})} placeholder="Elegí una" opciones={["Fotografía","Film","Música","Otro"]} ayuda="Podés postularte en más de una." />
      <Campo etiqueta="Mensaje corto" tipo="textarea" nombre="msg" filas={2} valor={v.msg} onChange={e=>setV({...v,msg:e.target.value})} placeholder="Contanos en dos líneas" />
      <Campo etiqueta="Acepto que Seres Migratorios guarde mis datos para esta convocatoria." tipo="checkbox" nombre="ok" valor={v.ok} onChange={e=>setV({...v,ok:e.target.checked})} style={{gridColumn:'1 / -1'}} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
