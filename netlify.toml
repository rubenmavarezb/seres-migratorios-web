# Configuración de Netlify — Seres Migratorios (PLAN.md §4.3).
# El sitio es 100 % estático: no hay adapter de Astro, alcanza con este archivo.
# Los valores reales de las variables PUBLIC_* viven en el panel de Netlify
# (Site configuration > Environment variables), no acá. Ver .env.example.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Misma versión que .nvmrc y que "engines" de package.json.
  NODE_VERSION = "22"

# Redirects de slugs viejos. PLAN.md §10: los slugs de contenido no cambian
# nunca; si hay que renombrar una ruta, el redirect se agrega acá.
# force = true para que el 301 gane incluso si algún día existe /fotografos en dist.

[[redirects]]
  from = "/fotografos"
  to = "/artistas"
  status = 301
  force = true

[[redirects]]
  from = "/fotografos/*"
  to = "/artistas/:splat"
  status = 301
  force = true

# www → dominio raíz (SM-064, hecha el 06.09.2026). El apex es la URL canónica;
# Netlify ya redirige el alias www a nivel de plataforma, esta regla lo deja explícito.
[[redirects]]
  from = "https://www.seresmigratorios.com/*"
  to = "https://seresmigratorios.com/:splat"
  status = 301
  force = true

# 404 en inglés (SM-048). Netlify sirve dist/404.html para cualquier ruta que no
# existe; esta regla, sin `force`, solo se aplica cuando /en/* no existe en el
# deploy y devuelve la 404 en inglés (Astro emite src/pages/en/404.astro como
# dist/en/404/index.html, no como dist/en/404.html).
[[redirects]]
  from = "/en/*"
  to = "/en/404/index.html"
  status = 404
